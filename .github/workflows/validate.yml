---
name: validate
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain (poetry, pinned collections)
        run: |
          pip install poetry
          poetry install --no-root
          make deps
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Vault client shim (CI has no secrets; the mock inventory is unvaulted)
        run: |
          mkdir -p ~/.mhl/vault ~/.mhl/bin && chmod 700 ~/.mhl/vault
          printf 'ci-dummy-password' > ~/.mhl/vault/mhl.pass && chmod 600 ~/.mhl/vault/mhl.pass
          install -m 700 scripts/mhl-vault-client ~/.mhl/bin/mhl-vault-client
      - name: Lint, syntax, no-secrets, hook tests (portable subset)
        run: make ci
