[defaults]
# Project-local collections only (installed by `make deps` from requirements.yml)
# so the fleet is built from the pinned set, never from whatever ~/.ansible has.
collections_path = ./collections
roles_path = ./roles
filter_plugins = ./filter_plugins
# Vault password source. NB: a relative path here resolves against cwd, not
# this file (verified 2026-08-25) — keep it absolute or ~/-relative.
vault_identity_list = mhl@~/.mhl/bin/mhl-vault-client
vault_encrypt_identity = mhl

[inventory]
enable_plugins = vmware.vmware.vms, yaml, ini
