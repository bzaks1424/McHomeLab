---
- name: "Install package: {{ role_name }}"
  ansible.builtin.apt:
    name: "{{ role_name }}"
    state: present
    update_cache: true
- name: "Check for CA certificate"
  ansible.builtin.stat:
    path: "{{ ca_cert_import_dest }}"
  register: _ca_cert_file
  when: ca_cert_import_dest | length > 0
- name: "Update CA certificate trust store"
  ansible.builtin.command:
    cmd: /usr/sbin/update-ca-certificates
  register: _ca_update
  # `creates:` missed CA rotation (same file name, new content). update-ca-certificates
  # reports "N added, M removed"; changed only when either is non-zero.
  changed_when: _ca_update.stdout is search('([1-9][0-9]*) added|([1-9][0-9]*) removed')
  when:
    - _ca_cert_file is defined
    - _ca_cert_file.stat.exists | default(false)
