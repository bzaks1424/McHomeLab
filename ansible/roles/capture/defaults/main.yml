---
# Observed-system captures run on the controller (Phase 4, decision Q11):
# the system produces its own backup; MHL pulls it to HomeLabBackup, verifies
# it, and records a manifest. Declared on the controller in hosts.yml:
#   captures:
#     - {name: "unifi-network", kind: "unifi_network"}
capture_root: "/mnt/Backups/HomeLabBackup"
capture_unifly_bin: "{{ lookup('env', 'HOME') }}/bin/unifly"
capture_unifi_objects: ["networks", "firewall zones", "firewall policies", "dns", "acl", "traffic-lists"]
capture_keep: 14
controller_captures: "{{ hostvars[inventory_hostname].captures | default([]) }}"
capture_max_age_days: 2
# Encrypts pulled exports before they land on the shared export (same key as service backups).
capture_key_path: "{{ lookup('env', 'HOME') }}/.mhl/vault/backup.pass"
capture_uisp_retries: 60
capture_uisp_delay: 5
# Plaintext downloads live here (controller local disk, 0700) and are shredded; never on the share.
capture_tmp_dir: "{{ lookup('env', 'HOME') }}/.mhl/tmp"
