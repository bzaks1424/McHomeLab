---
# defaults file for controller
controller_nfs_mount_mode_default: "0755"

# Expiry watch: warn when a served certificate or a declared credential is within this many days.
controller_expiry_warn_days: 30
# Declared in hosts.yml on the controller: credential_expiries:
#   - {name: "wud_lscr_token", where: "GitHub PAT for LSCR pulls (WUD)", expires: "2027-08-24"}
controller_credential_expiries: "{{ hostvars[inventory_hostname].credential_expiries | default([]) }}"

# Toolchain (Q12)
controller_step_cli_version: "0.28.2"
controller_step_cli_deb: "https://github.com/smallstep/cli/releases/download/v{{ controller_step_cli_version }}/step-cli_{{ controller_step_cli_version }}-1_amd64.deb"
controller_step_cli_sha256: "4cd7d5dbab8b33163c2ab504eb448e8cf17a26c72814929d28a5d37a241d8c6a"
controller_step_cli_download: "{{ controller_mhl_home }}/downloads/step-cli_{{ controller_step_cli_version }}_amd64.deb"
controller_manage_docker_cli: true
# unifly (UniFi CLI; read engine for governance/capture, write engine for the unifi role).
# 0.10.0 fixes create --action block (0.9.x sent DROP, rejected by the Integration API).
controller_unifly_version: "0.10.0"
controller_unifly_url: "https://github.com/hyperb1iss/unifly/releases/download/v{{ controller_unifly_version }}/unifly-linux-amd64"
controller_unifly_sha256: "d2160a06fafc104f5122719daf5ed38ee2ee28bab7c7778f7776994c01a15424"
controller_unifly_bin: "{{ lookup('env', 'HOME') }}/bin/unifly"
controller_mhl_home: "{{ lookup('env', 'HOME') }}/.mhl"
controller_root_ca_cert: "{{ hostvars['localhost'].registry | registry_get('root_ca_cert', export_root ~ '/util/root_ca_cert') }}"
controller_remote_api_hosts: >-
  {{ hostvars | dict2items | selectattr('value.docker.remote_api', 'defined')
     | selectattr('value.docker.remote_api', 'eq', true) | map(attribute='key') | list }}

# Vault escrow: mirror ~/.mhl/vault into a folder that Google Drive syncs (Mike's safe backup).
# Declared in hosts.yml on the controller as vault_escrow_dir; unset = no escrow.
controller_vault_escrow_dir: "{{ hostvars[inventory_hostname].vault_escrow_dir | default('') }}"
controller_vault_escrow_minute: "17"
# The escrow folder must sit on a mounted filesystem (never the local disk): first two path components.
controller_vault_escrow_mount: "/{{ controller_vault_escrow_dir.split('/')[1:3] | join('/') }}"
# -rti: recursive, times, itemized (no owner/perm/group — the destination is a shared export)
# Append-only on purpose: never --delete (a rebuilt controller with a near-empty vault must not
# wipe the Drive copy). The sync also refuses to run unless the source holds the expected files.
controller_vault_escrow_required: ["mhl.pass", "backup.pass"]
controller_vault_escrow_rsync: "rsync -rti {{ controller_mhl_home }}/vault/ {{ controller_vault_escrow_dir | quote }}/"
# The cron line guards the mount itself; the play guards it with its own task before syncing.
controller_vault_escrow_cmd: >-
  mountpoint -q {{ controller_vault_escrow_mount | quote }}
  && test -s {{ controller_mhl_home }}/vault/mhl.pass
  && test -s {{ controller_mhl_home }}/vault/backup.pass
  && {{ controller_vault_escrow_rsync }}
