---
docker_keyring_path_default: /etc/apt/keyrings
# Pinned so the key is verified on download and the task is idempotent under --check.
# Without it get_url cannot compare in check mode and reports `changed` on every run,
# which made /drift permanently noisy on all three docker hosts. Same convention as
# controller_step_cli_sha256 and controller_unifly_sha256.
# If Docker rotates the key this task FAILS rather than silently accepting a new one;
# re-pin deliberately after checking the new key.
docker_gpg_key_sha256: "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"
docker_keyring_dir_mode_default: "0755"
docker_file_mode_default: "0644"
docker_group_name: docker
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
# --- daemon configuration (Step 1 of research/RESEARCH_WUD_MTLS.md) ---
# Rendered to /etc/docker/daemon.json. "hosts" lives here (not on the unit's
# ExecStart) so a TCP listener can be added later without the "specified both
# as a flag and in the configuration file" refusal. live-restore keeps
# containers running across dockerd restarts (TLS rollout, cert rotation,
# package upgrades) — enabling it costs exactly one restart.
docker_daemon_config:
  hosts:
    - "fd://"
  live-restore: true
docker_daemon_json_path: "/etc/docker/daemon.json"
docker_unit_override_dir: "/etc/systemd/system/docker.service.d"
docker_unit_override_path: "/etc/systemd/system/docker.service.d/override.conf"
docker_dockerd_bin: "/usr/bin/dockerd"
docker_containerd_sock: "/run/containerd/containerd.sock"
# --- remote API TLS leaves (Step 2 of research/RESEARCH_WUD_MTLS.md) ---
# Issued from step-ca via the step-ca-cert role; 5 years, renewed in place by
# any site.yml run inside the last 30 days of validity.
docker_tls_cert_duration: "43800h"
docker_tls_cert_renewal_threshold: "720h"
docker_tls_dir_name: "docker-tls"
# --- remote API listener (Step 3 of research/RESEARCH_WUD_MTLS.md) ---
docker_remote_api_port: 2376
docker_tls_remote_dir: "/etc/docker/tls"
docker_tls_remote_file_mode: "0600"
