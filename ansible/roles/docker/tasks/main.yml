---
# https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/apt_key_module.html
# https://docs.docker.com/engine/install/ubuntu/
# https://docs.docker.com/engine/install/linux-postinstall
- name: "Validate Keyring Directory Exists and is correct mode"
  ansible.builtin.file:
    path: "{{ docker_keyring_path_default }}"
    state: directory
    mode: "{{ docker_keyring_dir_mode_default }}"
- name: "Download Docker GPG key and drop it in keyrings"
  ansible.builtin.get_url:
    url: "{{ docker_ubuntu_asc_url }}"
    dest: "{{ docker_keyring_asc }}"
    mode: "{{ docker_file_mode_default }}"
- name: "Docker Repo Configuration"
  ansible.builtin.apt_repository:
    repo: "{{ docker_ubuntu_repo }}"
    mode: "{{ docker_file_mode_default }}"
    update_cache: true
    state: present
- name: "Install Default Docker Packages"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
- name: "Does '{{ docker_group_name }}' group exist"
  ansible.builtin.group:
    name: "{{ docker_group_name }}"
    state: present
  register: docker_group
- name: "Add the current user to the '{{ docker_group_name }}' group"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ docker_group_name }}"
    append: true
    state: present
  register: docker_user
- name: "Issue remote-API TLS material (controller-side)"
  ansible.builtin.include_tasks: tls.yml
  when: docker_remote_api | bool
- name: "Ensure docker unit override directory exists"
  ansible.builtin.file:
    path: "{{ docker_unit_override_dir }}"
    state: directory
    mode: "{{ docker_keyring_dir_mode_default }}"
- name: "Template docker unit override (socket config moves to daemon.json)"
  ansible.builtin.template:
    src: override.conf.j2
    dest: "{{ docker_unit_override_path }}"
    mode: "{{ docker_file_mode_default }}"
  notify:
    - "Reload systemd units"
    - "Restart docker"
- name: "Template docker daemon.json"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_daemon_json_path }}"
    mode: "{{ docker_file_mode_default }}"
  notify: "Restart docker"
# Restart now (not at end of play) so the compose deploy that follows sees
# the configured daemon. With live-restore already on, this is container-safe;
# the first time it runs, every container on the host restarts once.
- name: "Apply docker daemon configuration"
  ansible.builtin.meta: flush_handlers
- name: "Refresh the SSH session to apply new group membership"
  ansible.builtin.meta: refresh_inventory
  # ansible.builtin.meta: reset_connection
