---
# PXE cleanup: remove the per-MAC iPXE script from the PXE server so future boots show the
# normal menu. Delegated file task (check-mode honest); the provision phase runs with
# ansible_connection: local, so ssh is forced for the delegation. The per-host autoinstall
# dir (user-data/meta-data) is kept for reprovisioning reference.
- name: "Remove MAC-{{ host_vm_mac | replace(':', '') }}.ipxe from {{ host_provision_pxe_server }}"
  vars:
    _pxe_host: >-
      {{ hostvars | dict2items | selectattr('value.ansible_host', 'defined')
         | selectattr('value.ansible_host', 'equalto', host_provision_pxe_server) | map(attribute='key') | first }}
    ansible_connection: ssh
  ansible.builtin.file:
    path: "{{ host_provision_pxe_config_dir }}/menus/MAC-{{ host_vm_mac | replace(':', '') }}.ipxe"
    state: absent
  delegate_to: "{{ _pxe_host }}"
  become: true
