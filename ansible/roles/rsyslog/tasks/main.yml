---
# tasks file for {{ role_name }}
- name: "Refuse to forward logs to a placeholder"
  ansible.builtin.fail:
    msg: "ext_syslog_server is not set for {{ inventory_hostname }} — declare the syslog target in hosts.yml (all.vars)"
  when: ext_syslog_server is not defined

- name: "Retire the old vendor-named config file"
  ansible.builtin.file:
    path: "/etc/rsyslog.d/90-synology.conf"
    state: absent
  notify: "Restart rsyslog"

- name: "Deploy rsyslog forwarding config"
  ansible.builtin.template:
    src: "{{ rsyslog_template_src }}"
    dest: "{{ rsyslog_template_dest }}"
    mode: "{{ rsyslog_template_mode }}"
    backup: true
  notify: "Restart {{ rsyslog_service_name }}"
