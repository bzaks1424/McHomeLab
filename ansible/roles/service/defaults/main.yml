---
service_dir: "/opt/docker/compose"
service_file_mode: "0644"
service_dir_mode: "0755"
service_docker_socket: "/var/run/docker.sock"
service_docker_host_gateway: "host.docker.internal:host-gateway"
traefik_image: "traefik:v3.6"
traefik_cert_resolver: "step-ca"
traefik_admin_port: 9880
gluetun_image: "qmcgaw/gluetun:v3"
wud_image: "getwud/wud:8.3.1"
# WUD client certificate for remote docker watchers (research/RESEARCH_WUD_MTLS.md)
service_wud_cert_duration: "43800h"
service_wud_cert_renewal_threshold: "720h"
service_wud_tls_dir_name: "docker-tls/client"
# Image pull policy for the compose deploy (STRATEGY §6.3 C). "policy" is the
# module default: pull only what compose's own pull_policy says (i.e. missing
# images) — today's behaviour exactly. Override per run to apply an update:
#   ansible-playbook site.yml -e service_pull_policy=always
service_pull_policy: "policy"
# WUD tag regexes for the infrastructure images (keeps WUD comparing against
# real Linux release tags — e.g. traefik's "v3.7-windowsservercore" is noise)
traefik_wud_tag_include: '^v\d+\.\d+\.\d+$'
gluetun_wud_tag_include: '^v\d+\.\d+\.\d+$'
wud_wud_tag_include: '^\d+\.\d+\.\d+$'

# Files under service_dir that a previous configuration created and the current one
# does not: removed on every run so the inventory is authoritative for that directory.
# Declared per host in hosts.yml (service_retire_paths). Absolute paths only.
service_retire_paths: []

# Backups (Mike's rule: restore-and-run artefacts live on the Synology, config in git).
# A service may declare in hosts.yml:
#   backup:
#     paths: ["/opt/containers/step-ca/secrets", "/opt/containers/step-ca/db"]
#     schedule: "daily"          # systemd OnCalendar
#     keep: 14                   # snapshots to retain
# Snapshots land in {{ service_backup_root }}/{{ inventory_hostname }}/<service>/<UTC stamp>/
# with a `latest` symlink and a SHA256SUMS manifest. The timer is installed only when
# the backup root is a mounted filesystem; otherwise the run reports and moves on.
service_backup_root: "/mnt/Backups/HomeLabBackup"
service_backup_script_dir: "/usr/local/sbin"
# Backups are encrypted with a per-host key delivered from the inventory
# (service_backup_passphrase, vaulted) — the share is a shared NFS export.
service_backup_key_path: "/root/.mhl-backup.key"
service_backup_passphrase: "SHOULD_NOT_BE_HERE"

# `-e service_backup_force_run=true` on site.yml runs every declared backup once (codified trigger).
service_backup_force_run: false

# Compose secrets (R-A §4.3): secret values never land in the 0644 compose file.
# Each becomes {{ service_secrets_dir }}/<service>/<VAR> (0400, owner per image
# family) mounted at /run/secrets/<service>_<VAR>, and the container gets the
# image family's file-form env var instead of the value:
#   gluetun  -> VAR_SECRETFILE   lsio -> FILE__VAR   wud -> VAR__FILE   generic -> VAR_FILE
# Regular services declare `secrets: {VAR: !vault ...}` and `secret_style:`;
# the gluetun/wud infrastructure templates use this automatically.
service_secrets_dir: "{{ service_dir }}/secrets"
service_secrets_dir_mode: "0700"
service_secret_file_mode: "0400"
service_secret_styles:
  gluetun: {prefix: "", suffix: "_SECRETFILE", owner: "root"}
  lsio: {prefix: "FILE__", suffix: "", owner: "root"}
  wud: {prefix: "", suffix: "__FILE", owner: "1000"}
  generic: {prefix: "", suffix: "_FILE", owner: "root"}
