---
# Idempotent "this API setting equals X" (research/RESEARCH_SYSADMIN_AGENT.md §3 A2).
# One invocation per declared setting group (`item`):
#   service: <name>                         # compose service (for the report)
#   url: ".../api/system/settings"          # write endpoint
#   method: "POST"                          # write method
#   headers: {X-API-KEY: "..."}             # optional (vaulted in hosts.yml)
#   login: {url: ".../auth/login", body: {username: ..., password: ...}}   # optional cookie login
#   read: {url: "...", path: ""}            # read endpoint (default: url) and optional json_query path
#   want: {key: value, ...}                 # desired values, compared as strings against the read result
#   write_body: {...}                       # body to send when different (default: want)
#   body_format: "json" | "form-urlencoded"
#   status_code: [200, 204]
# Reads always run (check_mode: false, changed_when: false) so --check shows the
# would-change; the write is skipped under --check. Values are never logged.
- name: "Login to {{ item.service }} API"
  when: item.login is defined
  ansible.builtin.uri:
    url: "{{ item.login.url }}"
    method: "POST"
    body: "{{ item.login.body }}"
    body_format: "form-urlencoded"
    validate_certs: "{{ item.validate_certs | default(true) }}"
    status_code: [200, 204]
  register: _api_login
  check_mode: false
  changed_when: false
  no_log: true
  until: _api_login.status | default(0) in [200, 204]
  retries: "{{ item.retries | default(12) }}"
  delay: "{{ item.delay | default(10) }}"

- name: "Read current settings from {{ item.service }}"
  ansible.builtin.uri:
    url: "{{ item.read.url | default(item.url) }}"
    method: "GET"
    headers: "{{ item.headers | default({}) | combine({'Cookie': (_api_login.cookies_string | default(''))}) }}"
    validate_certs: "{{ item.validate_certs | default(true) }}"
    return_content: true
    status_code: [200]
  register: _api_current
  check_mode: false
  changed_when: false
  no_log: true
  # Apps behind gluetun restart whenever gluetun is recreated: wait for them.
  until: _api_current.status | default(0) == 200
  retries: "{{ item.retries | default(12) }}"
  delay: "{{ item.delay | default(10) }}"

- name: "Settings read must be JSON, else a login page would be written every run — {{ item.service }}"
  ansible.builtin.assert:
    that: _api_current.json is defined and _api_current.json is not string
    fail_msg: "{{ item.service }}: settings read returned non-JSON ({{ _api_current.content_type | default('?') }}) — not writing"

- name: "Extract current values for {{ item.service }}"
  ansible.builtin.set_fact:
    _api_actual: "{{ (_api_current.json | default({})) if (item.read.path | default('')) == '' else (_api_current.json | default({}) | json_query(item.read.path)) }}"
    _api_changed_keys: []
  no_log: true

- name: "Read result must be a mapping at read.path — {{ item.service }}"
  ansible.builtin.assert:
    that: _api_actual is mapping
    fail_msg: "{{ item.service }}: read.path {{ item.read.path | default('') }} did not yield a mapping (section renamed, or a list) — not writing"

- name: "Compare declared vs actual for {{ item.service }}"
  ansible.builtin.set_fact:
    _api_changed_keys: "{{ _api_changed_keys + [entry.key] }}"
  loop: "{{ item.want | dict2items }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.key }}"
  when: not (_api_actual[entry.key] | default(none) | api_value_equal(entry.value))
  no_log: true

- name: "Refuse to write keys the API does not report (typo in want:, or wrong read.path) — {{ item.service }}"
  ansible.builtin.assert:
    that: item.want.keys() | reject('in', _api_actual.keys()) | list | length == 0 or (item.allow_absent | default(false))
    fail_msg: "{{ item.service }}: declared keys not present in the API read: {{ item.want.keys() | reject('in', _api_actual.keys()) | list }} (set allow_absent: true if intended)"

- name: "Report {{ item.service }} settings that differ from the inventory"
  ansible.builtin.debug:
    msg: "{{ item.service }}: {{ _api_changed_keys | length }} setting(s) differ: {{ _api_changed_keys }}"
  when: _api_changed_keys | length > 0

- name: "Write settings to {{ item.service }}"
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: "{{ item.method | default('POST') }}"
    headers: "{{ item.headers | default({}) | combine({'Cookie': (_api_login.cookies_string | default(''))}) }}"
    body: "{{ item.write_body | default(item.want) }}"
    body_format: "{{ item.body_format | default('json') }}"
    validate_certs: "{{ item.validate_certs | default(true) }}"
    status_code: "{{ item.status_code | default([200, 204]) }}"
  when: _api_changed_keys | length > 0
  changed_when: true
  no_log: true

- name: "Clear per-item API facts"
  ansible.builtin.set_fact:
    _api_login: {}
    _api_current: {}
    _api_actual: {}
