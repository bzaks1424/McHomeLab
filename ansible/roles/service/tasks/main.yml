---
- name: "Create compose directory"
  ansible.builtin.file:
    path: "{{ service_dir }}"
    state: directory
    mode: "{{ service_dir_mode }}"

# A bind mount source may be a file delivered by an import entry (e.g. the
# root CA cert) — only pre-create sources that don't exist yet, so docker
# doesn't create them as root-owned directories.
- name: "Stat bind mount sources"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: service_bind_mount_stats
  loop: >-
    {{
      ((service_services | dict2items
        | selectattr('value.volumes', 'defined')
        | map(attribute='value.volumes')
        | flatten
        | map('regex_replace', ':.*$', '')
        | select('match', '/')
        | reject('match', '/var/run/')
        | reject('match', '/dev/')
        | reject('match', '/proc/')
        | reject('match', '/sys/')
        | list)
       + _infra_volume_paths)
      | unique
      | reject('in', _os_mount_paths)
      | list
    }}
  vars:
    _os_mount_paths: >-
      {{ (hostvars[inventory_hostname].provision.mounts | default([]))
         | map(attribute='path') | list }}
    _infra_volume_paths: >-
      {{ [service_infra_services.traefik.config.certs_volume | default(''),
          service_infra_services.wud.config.data_volume | default('')]
         | select | list }}

- name: "Pre-create missing bind mount directories"
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    mode: "{{ service_dir_mode }}"
  loop: "{{ service_bind_mount_stats.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: "Issue WUD client certificate for remote docker watchers (controller-side)"
  when: "'wud' in service_infra_services"
  block:
    - name: "Issue WUD client certificate"
      ansible.builtin.include_role:
        name: step-ca-cert
      vars:
        step_ca_cert_cn: "{{ service_wud_tls_cn }}"
        step_ca_cert_sans: ["{{ service_wud_tls_cn }}"]
        step_ca_cert_dir: "{{ service_wud_tls_dir }}"
        step_ca_cert_path: "{{ service_wud_tls_cert_path }}"
        step_ca_cert_key_path: "{{ service_wud_tls_key_path }}"
        step_ca_cert_root_path: "{{ service_wud_tls_root_path }}"
        step_ca_cert_url: "{{ service_wud_tls_ca_url }}"
        step_ca_cert_provisioner_password: "{{ service_wud_tls_provisioner_password }}"
        step_ca_cert_duration: "{{ service_wud_cert_duration }}"
        step_ca_cert_renewal_threshold: "{{ service_wud_cert_renewal_threshold }}"
    # Step 5: deliver to the host. WUD reads the files at startup, so a
    # changed leaf (rotation) restarts only the wud container via the handler.
    - name: "Ensure WUD TLS directory exists"
      ansible.builtin.file:
        path: "{{ service_wud_tls_host_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: "Deliver WUD client TLS material"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ service_wud_tls_host_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { name: "ca.pem", src: "{{ service_wud_tls_root_path }}" }
        - { name: "cert.pem", src: "{{ service_wud_tls_cert_path }}" }
        - { name: "key.pem", src: "{{ service_wud_tls_key_path }}" }
      loop_control:
        label: "{{ item.name }}"
      notify: "Restart wud"

- name: "Install backup scripts and timers for services that declare backup:"
  when: service_backup_services | length > 0
  block:
    - name: "Check the backup root is a mounted filesystem"
      ansible.builtin.command:
        argv: ["mountpoint", "-q", "{{ service_backup_root | dirname }}"]
      register: _service_backup_mounted
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "Report when the backup root is not mounted"
      ansible.builtin.debug:
        msg: "BACKUP ROOT NOT MOUNTED ({{ service_backup_root | dirname }}): timers installed but will skip until it is"
      when: _service_backup_mounted.rc != 0
    - name: "Template backup script"
      ansible.builtin.template:
        src: mhl-backup.sh.j2
        dest: "{{ service_backup_script_dir }}/mhl-backup-{{ item.key }}"
        mode: "0755"
      loop: "{{ service_backup_services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    - name: "Template backup systemd service"
      ansible.builtin.template:
        src: mhl-backup.service.j2
        dest: "/etc/systemd/system/mhl-backup-{{ item.key }}.service"
        mode: "0644"
      loop: "{{ service_backup_services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    - name: "Template backup systemd timer"
      ansible.builtin.template:
        src: mhl-backup.timer.j2
        dest: "/etc/systemd/system/mhl-backup-{{ item.key }}.timer"
        mode: "0644"
      loop: "{{ service_backup_services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    - name: "Enable backup timers"
      ansible.builtin.systemd:
        name: "mhl-backup-{{ item.key }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ service_backup_services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: "Retire files the inventory no longer declares"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ service_retire_paths }}"
  when: item is match('^/opt/')  # never outside the container tree

- name: "Template docker-compose.yml"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ service_dir }}/docker-compose.yml"
    mode: "{{ service_file_mode }}"

- name: "Template traefik external routes config"
  when:
    - "'traefik' in service_infra_services"
    - "service_infra_services.traefik.config.external_routes is defined"
  ansible.builtin.template:
    src: traefik-external.yml.j2
    dest: "{{ service_dir }}/traefik-external.yml"
    mode: "{{ service_file_mode }}"

- name: "Deploy compose stack"
  community.docker.docker_compose_v2:
    project_src: "{{ service_dir }}"
    state: present
    remove_orphans: true   # hosts.yml is authoritative: removed services are removed
    pull: "{{ service_pull_policy }}"
