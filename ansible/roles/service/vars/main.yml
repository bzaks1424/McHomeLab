---
# All services from hosts.yml
service_services: "{{ hostvars[inventory_hostname].services | default({}) }}"

# Services sorted by priority (for compose ordering)
service_services_sorted: >-
  {{ service_services | dict2items
     | sort(attribute='value.priority', reverse=false)
     | items2dict }}

# Infrastructure services (traefik, gluetun) — rendered from role templates
service_infra_services: >-
  {{ service_services | dict2items
     | selectattr('value.type', 'defined')
     | selectattr('value.type', 'eq', 'infrastructure')
     | items2dict }}

# Regular services — rendered as standard compose blocks
service_regular_services: >-
  {{ service_services | dict2items
     | rejectattr('value.type', 'defined')
     | items2dict }}

# Services tunneled through gluetun (have network_mode: "service:gluetun")
service_gluetun_tunneled: >-
  {{ service_services | dict2items
     | selectattr('value.network_mode', 'defined')
     | selectattr('value.network_mode', 'eq', 'service:gluetun')
     | items2dict }}

# Service definitions across every inventory host, as dict2items entries
# (for the fleet-wide diun watch list)
service_fleet_service_items: >-
  {{ groups['all']
     | map('extract', hostvars)
     | map(attribute='services', default={})
     | map('dict2items')
     | flatten }}

# Explicit images from regular services, fleet-wide, deduped
service_fleet_regular_images: >-
  {{ service_fleet_service_items
     | selectattr('value.image', 'defined')
     | map(attribute='value.image')
     | unique | list }}

# Infrastructure service names in use anywhere in the fleet
service_fleet_infra_names: >-
  {{ service_fleet_service_items
     | selectattr('value.type', 'defined')
     | selectattr('value.type', 'eq', 'infrastructure')
     | map(attribute='key')
     | unique | list }}

# Images of infrastructure services in use anywhere in the fleet
service_fleet_infra_images: >-
  {{ ([traefik_image] if 'traefik' in service_fleet_infra_names else [])
   + ([gluetun_image] if 'gluetun' in service_fleet_infra_names else [])
   + ([diun_image] if 'diun' in service_fleet_infra_names else []) }}

# Everything diun watches: every image referenced in the inventory
service_diun_watch_images: >-
  {{ (service_fleet_regular_images + service_fleet_infra_images)
     | unique | list }}

# CA cert container path — derived from import entry basename
service_ca_cert_container_path: "/etc/ssl/certs/{{ hostvars[inventory_hostname] | inventory_entry('import', 'root_ca_cert', 'dest', '') | basename }}"
