---
# All services from hosts.yml
service_services: "{{ hostvars[inventory_hostname].services | default({}) }}"

# Services sorted by priority (for compose ordering)
service_services_sorted: >-
  {{ service_services | dict2items
     | sort(attribute='value.priority', reverse=false)
     | items2dict }}

# Infrastructure services (traefik, gluetun) — rendered from role templates
service_infra_services: >-
  {{ service_services | dict2items
     | selectattr('value.type', 'defined')
     | selectattr('value.type', 'eq', 'infrastructure')
     | items2dict }}

# Regular services — rendered as standard compose blocks
service_regular_services: >-
  {{ service_services | dict2items
     | rejectattr('value.type', 'defined')
     | items2dict }}

# Services tunneled through gluetun (have network_mode: "service:gluetun")
service_gluetun_tunneled: >-
  {{ service_services | dict2items
     | selectattr('value.network_mode', 'defined')
     | selectattr('value.network_mode', 'eq', 'service:gluetun')
     | items2dict }}

# CA cert container path — derived from import entry basename
service_ca_cert_container_path: "/etc/ssl/certs/{{ hostvars[inventory_hostname] | inventory_entry('import', 'root_ca_cert', 'dest', '') | basename }}"

# --- WUD client leaf (issued on the controller; mounted into the container at step 5) ---
service_wud_tls_cn: "wud.{{ ansible_host }}"
service_wud_tls_dir: "{{ export_root }}/{{ inventory_hostname }}/{{ service_wud_tls_dir_name }}"
service_wud_tls_cert_path: "{{ service_wud_tls_dir }}/cert.pem"
service_wud_tls_key_path: "{{ service_wud_tls_dir }}/key.pem"
service_wud_tls_root_path: "{{ hostvars['localhost'].registry | registry_get('root_ca_cert') }}"
service_wud_tls_ca_url: "{{ step_ca_url | default('SHOULD_NOT_BE_HERE') }}"
service_wud_tls_provisioner_password: "{{ step_ca_provisioner_password | default('SHOULD_NOT_BE_HERE') }}"
