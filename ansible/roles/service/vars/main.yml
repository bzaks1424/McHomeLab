---
# All services from hosts.yml
service_services: "{{ hostvars[inventory_hostname].services | default({}) }}"

# Services sorted by priority (for compose ordering)
service_services_sorted: >-
  {{ service_services | dict2items
     | sort(attribute='value.priority', reverse=false)
     | items2dict }}

# Infrastructure services (traefik, gluetun) — rendered from role templates
service_infra_services: >-
  {{ service_services | dict2items
     | selectattr('value.type', 'defined')
     | selectattr('value.type', 'eq', 'infrastructure')
     | items2dict }}

# Regular services — rendered as standard compose blocks
service_regular_services: >-
  {{ service_services | dict2items
     | rejectattr('value.type', 'defined')
     | items2dict }}

# Services tunneled through gluetun (have network_mode: "service:gluetun")
service_gluetun_tunneled: >-
  {{ service_services | dict2items
     | selectattr('value.network_mode', 'defined')
     | selectattr('value.network_mode', 'eq', 'service:gluetun')
     | items2dict }}

# CA cert container path — derived from import entry basename
service_ca_cert_container_path: "/etc/ssl/certs/{{ hostvars[inventory_hostname] | inventory_entry('import', 'root_ca_cert', 'dest', '') | basename }}"

# --- WUD client leaf (issued on the controller; mounted into the container at step 5) ---
service_wud_tls_cn: "wud.{{ ansible_host }}"
service_wud_tls_dir: "{{ export_root }}/{{ inventory_hostname }}/{{ service_wud_tls_dir_name }}"
service_wud_tls_cert_path: "{{ service_wud_tls_dir }}/cert.pem"
service_wud_tls_key_path: "{{ service_wud_tls_dir }}/key.pem"
service_wud_tls_root_path: "{{ hostvars['localhost'].registry | registry_get('root_ca_cert') }}"
service_wud_tls_ca_url: "{{ step_ca_url | default('SHOULD_NOT_BE_HERE') }}"
service_wud_tls_provisioner_password: "{{ step_ca_provisioner_password | default('SHOULD_NOT_BE_HERE') }}"
# Where the client leaf lands on the host running WUD, and inside its container
service_wud_tls_host_dir: "{{ service_infra_services.wud.config.data_volume | default('') }}/tls"
service_wud_tls_container_dir: "/wud/tls"

# Services declaring a backup: block (see defaults)
service_backup_services: >-
  {{ service_services | dict2items | selectattr('value.backup', 'defined') | items2dict }}

# All api_settings groups across services (each group carries its `service:` label).
service_api_settings: >-
  {{ service_services | dict2items | selectattr('value.api_settings', 'defined')
     | map(attribute='value.api_settings') | list | flatten }}

# Secret manifest: one entry per (service, VAR). Regular services from `secrets:`;
# gluetun and wud infrastructure secrets from their config / the wud_* vars.
service_secret_manifest: >-
  {{ (service_services | dict2items | selectattr('value.secrets', 'defined') | list
      | map('service_secret_entries') | list | flatten)
     + (service_gluetun_secret_entries | default([]))
     + (service_wud_secret_entries | default([])) }}
service_gluetun_secret_entries: >-
  {{ [] if 'gluetun' not in service_infra_services else
     ([{'service': 'gluetun', 'name': 'WIREGUARD_PRIVATE_KEY', 'style': 'gluetun',
        'value': service_infra_services.gluetun.config.wireguard_private_key}]
      if service_infra_services.gluetun.config.wireguard_private_key is defined else [])
     + ([{'service': 'gluetun', 'name': 'WIREGUARD_PRESHARED_KEY', 'style': 'gluetun',
         'value': service_infra_services.gluetun.config.wireguard_preshared_key}]
        if service_infra_services.gluetun.config.wireguard_preshared_key is defined else [])
     + ([{'service': 'gluetun', 'name': 'OPENVPN_PASSWORD', 'style': 'gluetun',
         'value': service_infra_services.gluetun.config.vpn_password}]
        if service_infra_services.gluetun.config.vpn_password is defined else []) }}
service_wud_secret_entries: >-
  {{ [] if 'wud' not in service_infra_services else
     ([{'service': 'wud', 'name': 'WUD_REGISTRY_LSCR_LINUXSERVER_TOKEN', 'style': 'wud', 'value': wud_lscr_token}]
      if wud_lscr_token is defined else [])
     + ([{'service': 'wud', 'name': 'WUD_TRIGGER_MQTT_HA_PASSWORD', 'style': 'wud', 'value': wud_mqtt_password}]
        if wud_mqtt_password is defined else []) }}
