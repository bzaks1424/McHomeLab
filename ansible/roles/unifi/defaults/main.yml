---
# UniFi Network as code (Phase 5, R-C bring-up pattern): name-keyed objects declared
# on the controller in hosts.yml are reconciled through the unifly CLI —
# list -> match by name -> create / update only when a compared field differs.
# Zones are referenced by NAME; ids never appear in the inventory.
#   unifi:
#     firewall_policies:
#       - name: "ANSIBLE-Block-Internal-Docker-to-DMZ"
#         action: "block"            # allow | block | reject
#         source_zone: "Internal"
#         destination_zone: "Dmz"
#         destination_ports: ["2376"]
#         enabled: true
#         logging: true
#         description: "C5 (research/RESEARCH_SYSADMIN_AGENT.md §9 Q8)"
#     settings:
#       - key: "usg"
#         values:
#           dns_verification:
#             domain: "ui.com"
#             primary_dns_server: "45.90.30.224"
# Settings converge DECLARED KEYS ONLY. The usg section alone carries ~30 fields the
# lab has no opinion about, so anything not declared is left to the controller. There
# is no `state: absent`: a section cannot be created or deleted, and the opposite of
# declaring a field is simply not declaring it.
unifi_unifly_bin: "{{ lookup('env', 'HOME') }}/bin/unifly"
unifi_declared: "{{ hostvars[inventory_hostname].unifi | default({}) }}"
unifi_firewall_policies: "{{ unifi_declared.firewall_policies | default([]) }}"
unifi_nat_rules: "{{ unifi_declared.nat_rules | default([]) }}"
unifi_settings: "{{ unifi_declared.settings | default([]) }}"
