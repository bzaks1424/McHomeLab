---
# One declared firewall policy (`policy`): match by name, compare, create or update.
# Compared fields: action, enabled, source/destination zone, destination ports, logging.
- name: "UniFi policy {{ policy.name }}: resolve zones"
  ansible.builtin.assert:
    that:
      - policy.source_zone in _unifi_zone_ids
      - policy.destination_zone in _unifi_zone_ids
    fail_msg: "UniFi policy {{ policy.name }}: unknown zone (known: {{ _unifi_zone_ids.keys() | list }})"

- name: "UniFi policy {{ policy.name }}: desired vs actual"
  ansible.builtin.set_fact:
    _pol_actual: "{{ _unifi_policy_list | selectattr('name', 'equalto', policy.name) | list | first | default({}) }}"
    _pol_desired:
      action: "{{ policy.action | capitalize }}"
      enabled: "{{ policy.enabled | default(true) | bool }}"
      source_zone_id: "{{ _unifi_zone_ids[policy.source_zone] }}"
      destination_zone_id: "{{ _unifi_zone_ids[policy.destination_zone] }}"
      destination_ports: "{{ policy.destination_ports | default([]) | map('string') | sort }}"
      logging: "{{ policy.logging | default(false) | bool }}"

- name: "UniFi policy {{ policy.name }}: current values in the same shape"
  ansible.builtin.set_fact:
    _pol_current:
      action: "{{ _pol_actual.action | default('') }}"
      enabled: "{{ _pol_actual.enabled | default(false) | bool }}"
      source_zone_id: "{{ _pol_actual.source.zone_id | default('') }}"
      destination_zone_id: "{{ _pol_actual.destination.zone_id | default('') }}"
      # ['items'] not .items — dot access resolves to the dict method.
      destination_ports: "{{ ((((_pol_actual.destination | default({})).filter | default({}, true)).ports | default({}, true))['items'] | default([])) | map('string') | sort }}"
      logging: "{{ _pol_actual.logging_enabled | default(false) | bool }}"

- name: "UniFi policy {{ policy.name }}: diff"
  ansible.builtin.set_fact:
    _pol_diff: "{{ _pol_desired | unifi_diff(_pol_current) }}"

- name: "UniFi policy {{ policy.name }}: write arguments"
  ansible.builtin.set_fact:
    # unifly `create` takes every field; `update` only takes the matching-filter flags.
    _pol_create_args: >-
      {{ ["--name", policy.name,
          "--action", policy.action | lower,
          "--source-zone", _pol_desired.source_zone_id,
          "--dest-zone", _pol_desired.destination_zone_id,
          "--enabled", policy.enabled | default(true) | bool | string | lower,
          "--description", policy.description | default("managed by McHomeLab")]
         + (["--dst-port", _pol_desired.destination_ports | join(",")] if _pol_desired.destination_ports | length > 0 else [])
         + (["--logging"] if (policy.logging | default(false) | bool) else []) }}
    _pol_update_args: "{{ ['--dst-port', _pol_desired.destination_ports | join(',')] if _pol_desired.destination_ports | length > 0 else [] }}"
    _pol_unupdatable: "{{ _pol_diff | reject('in', ['destination_ports']) | list }}"

- name: "UniFi policy {{ policy.name }}: report"
  ansible.builtin.debug:
    msg: "{{ policy.name }}: {{ 'absent -> create' if _pol_actual == {} else ('differs in ' ~ (_pol_diff | join(', ')) if _pol_diff | length > 0 else 'in sync') }}"

- name: "UniFi policy {{ policy.name }}: refuse silent recreate"
  ansible.builtin.assert:
    that: _pol_actual == {} or _pol_unupdatable | length == 0
    fail_msg: >-
      UniFi policy {{ policy.name }} differs in {{ _pol_unupdatable | join(', ') }}, which unifly `update`
      cannot change — delete it in the controller (or rename the declaration) and re-apply; not done automatically.

- name: "UniFi policy {{ policy.name }}: create"
  ansible.builtin.command:
    argv: "{{ [unifi_unifly_bin, 'firewall', 'policies', 'create'] + _pol_create_args }}"
  when: _pol_actual == {}
  changed_when: true
  become: false

- name: "UniFi policy {{ policy.name }}: update"
  ansible.builtin.command:
    argv: "{{ [unifi_unifly_bin, 'firewall', 'policies', 'update', _pol_actual.id] + _pol_update_args }}"
  when: _pol_actual != {} and _pol_diff | length > 0
  changed_when: true
  become: false
