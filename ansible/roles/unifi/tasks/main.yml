---
# Runs on the controller (unifly profile lives there); never on the UniFi VM.
# One module call per declared policy: mhl_unifi_firewall_policy (ansible/library)
# does list -> match by name -> create / update / in sync, check-mode aware.
- name: "UniFi: reconcile declared firewall policies"
  mhl_unifi_firewall_policy:
    name: "{{ policy.name }}"
    action: "{{ policy.action }}"
    source_zone: "{{ policy.source_zone }}"
    destination_zone: "{{ policy.destination_zone }}"
    destination_ports: "{{ policy.destination_ports | default([]) }}"
    enabled: "{{ policy.enabled | default(true) }}"
    logging: "{{ policy.logging | default(false) }}"
    description: "{{ policy.description | default('managed by McHomeLab') }}"
    unifly_bin: "{{ unifi_unifly_bin }}"
    state: "{{ policy.state | default('present') }}"
  loop: "{{ unifi_firewall_policies }}"
  loop_control:
    loop_var: policy
    label: "{{ policy.name }}"
  register: _unifi_policy_results
  become: false

- name: "UniFi: report"
  ansible.builtin.debug:
    msg: "{{ _unifi_policy_results.results | map(attribute='name') | zip(_unifi_policy_results.results | map(attribute='state')) | map('join', ': ') | list }}"
  when: unifi_firewall_policies | length > 0

# NAT is reconciled through the RAW API, not `unifly nat policies`: that subcommand
# drops destination_filter.invert_address on read and writes it false on create
# (v0.10.0), which would invert the meaning of every per-VLAN DNS hijack rule while
# leaving it green in the UI. See library/mhl_unifi_nat_rule.py.
- name: "UniFi: reconcile declared NAT rules"
  mhl_unifi_nat_rule:
    description: "{{ rule.description }}"
    in_interface: "{{ rule.in_interface }}"
    type: "{{ rule.type | default('DNAT') }}"
    protocol: "{{ rule.protocol | default('tcp_udp') }}"
    ip_address: "{{ rule.ip_address | default(omit) }}"
    port: "{{ rule.port | default(omit) }}"
    destination_filter: "{{ rule.destination_filter | default(omit) }}"
    source_filter: "{{ rule.source_filter | default(omit) }}"
    enabled: "{{ rule.enabled | default(true) }}"
    logging: "{{ rule.logging | default(false) }}"
    exclude: "{{ rule.exclude | default(false) }}"
    unifly_bin: "{{ unifi_unifly_bin }}"
    state: "{{ rule.state | default('present') }}"
  loop: "{{ unifi_nat_rules }}"
  loop_control:
    loop_var: rule
    label: "{{ rule.description }}"
  register: _unifi_nat_results
  become: false

- name: "UniFi: NAT report"
  ansible.builtin.debug:
    msg: "{{ _unifi_nat_results.results | map(attribute='description') | zip(_unifi_nat_results.results | map(attribute='state')) | map('join', ': ') | list }}"
  when: unifi_nat_rules | length > 0

# Site settings converge DECLARED KEYS ONLY. A section always exists and carries far
# more fields than the lab has an opinion about, so the module compares and sends just
# what the inventory states. There is no `state: absent` for the same reason.
- name: "UniFi: reconcile declared site settings"
  mhl_unifi_setting:
    key: "{{ setting.key }}"
    values: "{{ setting.values }}"
    unifly_bin: "{{ unifi_unifly_bin }}"
  loop: "{{ unifi_settings }}"
  loop_control:
    loop_var: setting
    label: "{{ setting.key }}"
  register: _unifi_setting_results
  become: false

- name: "UniFi: settings report"
  ansible.builtin.debug:
    msg: "{{ _unifi_setting_results.results | map(attribute='key') | zip(_unifi_setting_results.results | map(attribute='state')) | map('join', ': ') | list }}"
  when: unifi_settings | length > 0
