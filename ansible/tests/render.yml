---
# Offline render test: for every host that declares services, template the
# compose stack on the controller and run `docker compose config -q`.
# Formalises the scratch pattern used during the WUD/recyclarr work
# (research/RESEARCH_SYSADMIN_AGENT.md §3 A3, item C3).
#
# Deliberately does NOT include the service role: include_role executes the
# role's meta dependencies (docker -> apt -> ...) against the render host, which
# on 2026-08-25 tried to modify /etc/apt on the controller. The role's vars and
# templates are loaded directly instead, so nothing here can mutate anything
# but the render directory.
- name: "Initialize registry for render"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Initialize registry"
      ansible.builtin.include_role:
        name: registry
        tasks_from: init

- name: "Render compose stacks"
  hosts: all
  gather_facts: false
  connection: local
  vars:
    service_role_dir: "{{ playbook_dir }}/../roles/service"
    service_render_root: "{{ lookup('env', 'MHL_RENDER_DIR') | default('/tmp/mhl-render', true) }}"
    service_render_dir: "{{ service_render_root }}/{{ inventory_hostname }}"
  tasks:
    - name: "Render services for {{ inventory_hostname }}"
      when: hostvars[inventory_hostname].services is defined
      block:
        # Role DEFAULTS must not outrank inventory (include_vars would): load them into a
        # dict and set only the keys the inventory does not define (drift finding F2).
        # lookup('file') output is marked unsafe, so defaults that reference other
        # defaults ("{{ service_dir }}/secrets") are not re-templated while looping.
        - name: "Load service role defaults (lowest precedence, untemplated)"
          ansible.builtin.set_fact:
            _service_defaults: "{{ lookup('ansible.builtin.file', service_role_dir ~ '/defaults/main.yml') | from_yaml }}"

        # Ansible templates loop items eagerly, so defaults that reference other
        # defaults cannot be looped; literal defaults here, the templated few below.
        - name: "Apply literal service role defaults only where the inventory is silent"
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ _service_defaults | dict2items | rejectattr('value', 'search', '{{') | list }}"
          loop_control:
            label: "{{ item.key }}"
          when: hostvars[inventory_hostname][item.key] is not defined

        - name: "Apply templated service role defaults (mirrors defaults/main.yml)"
          ansible.builtin.set_fact:
            service_secrets_dir: "{{ hostvars[inventory_hostname].service_secrets_dir | default(service_dir ~ '/secrets') }}"
            service_traefik_dynamic_dir: "{{ hostvars[inventory_hostname].service_traefik_dynamic_dir | default(service_dir ~ '/traefik-dynamic') }}"

        - name: "Assert the inventory image pins survived"
          ansible.builtin.assert:
            that:
              - "hostvars[inventory_hostname].traefik_image is not defined or traefik_image == hostvars[inventory_hostname].traefik_image"
              - "hostvars[inventory_hostname].gluetun_image is not defined or gluetun_image == hostvars[inventory_hostname].gluetun_image"
            fail_msg: "render used role defaults instead of inventory pins"

        - name: "Load service role vars"
          ansible.builtin.include_vars:
            file: "{{ service_role_dir }}/vars/main.yml"

        - name: "Create render directory"
          ansible.builtin.file:
            path: "{{ service_render_dir }}"
            state: directory
            mode: "0755"

        - name: "Render docker-compose.yml"
          ansible.builtin.template:
            src: "{{ service_role_dir }}/templates/docker-compose.yml.j2"
            dest: "{{ service_render_dir }}/docker-compose.yml"
            mode: "0644"

        - name: "Render traefik external routes config"
          when:
            - "'traefik' in service_infra_services"
            - "service_infra_services.traefik.config.external_routes is defined"
          ansible.builtin.template:
            src: "{{ service_role_dir }}/templates/traefik-external.yml.j2"
            dest: "{{ service_render_dir }}/traefik-dynamic-external.yml"
            mode: "0644"

        - name: "Validate rendered compose file"
          ansible.builtin.command:
            argv: ["docker", "compose", "-f", "{{ service_render_dir }}/docker-compose.yml", "config", "-q"]
          changed_when: false
